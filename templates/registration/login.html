{% extends "base.html" %}
{% block title %}Belépés – MesterKereső{% endblock %}
{% block content %}
  <h1>Belépés</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Belépek</button>
  </form>
  <p>Még nincs fiókod? <a href="{% url 'register' %}">Regisztráció</a></p>
{% endblock %}
