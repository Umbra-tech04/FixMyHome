<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hirdetés feladása – FixMyHome</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" id="theme-css" href="themes/a-hivis.css">
<script src="app.js"></script>
</head>
<body data-page="hirdetes-uj">
<main class="container">
  <div class="page-head"><div><h1 class="page-title">Hirdetés feladása</h1><p class="page-lead">Írd le, mi a gond – a közeli, megfelelő szakmájú mesterek jelentkeznek rá.</p></div></div>
  <form id="ad-form" class="form" novalidate>
    <div class="form-field"><label for="title">Cím</label><input id="title" name="title" maxlength="120" placeholder="Pl. Csöpög a konyhai csap" required data-msg="Adj címet a hirdetésnek."></div>
    <div class="form-field"><label for="desc">Leírás</label><textarea id="desc" name="desc" placeholder="Mi a gond, mióta, mekkora a munka?" required data-msg="Írj pár mondatot a problémáról."></textarea></div>
    <div class="form-row">
      <div class="form-field"><label for="cat">Szakma</label><select id="cat" name="cat" required data-msg="Válassz szakmát."></select></div>
      <div class="form-field"><label for="town">Település</label><select id="town" name="town" required data-msg="Válaszd ki a települést."></select></div>
    </div>
    <div class="form-field"><span class="label">Képek <span class="muted small">(nem kötelező)</span></span>
      <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Képek feltöltése">Húzd ide a képeket, vagy <u>kattints a tallózáshoz</u></div>
      <input type="file" name="images" accept="image/*" multiple hidden>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="form-actions"><button class="btn btn-primary" type="submit">Hirdetés feladása</button><a class="btn btn-ghost" href="mesterek.html">Mégse</a></div>
  </form>
</main>
</body>
</html>
