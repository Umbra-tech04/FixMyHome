<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesterek a közelben – FixMyHome</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" id="theme-css" href="themes/a-hivis.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="app.js"></script>
</head>
<body data-page="mesterek">
<main class="container">
  <h1 class="page-title">Mestert keresel?</h1>
  <p class="page-lead">Ellenőrzött szakemberek a környékeden – <span id="where-label">Szabadka</span> körül.</p>
  <div id="cat-grid" class="cat-grid" role="group" aria-label="Kategória"></div>
  <div class="toolbar">
    <button class="btn btn-primary" id="locate-btn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>Hol vagy?</button>
    <form id="where-form" class="row" role="search">
      <div class="form-field"><label for="where-input" class="sr-only">Település vagy irányítószám</label><input id="where-input" placeholder="Település vagy irányítószám" list="towns" style="width:260px"></div>
      <datalist id="towns"><option>Szabadka</option><option>Palics</option><option>Zenta</option><option>Topolya</option><option>Magyarkanizsa</option><option>Újvidék</option></datalist>
      <button class="btn btn-secondary">Keresés</button>
    </form>
    <span class="spacer"></span>
    <div class="row" role="group" aria-label="Körzet"><span class="muted small">Körzet:</span>
      <button class="chip" data-radius="5" aria-pressed="true">5 km</button><button class="chip" data-radius="10" aria-pressed="false">10 km</button><button class="chip" data-radius="20" aria-pressed="false">20 km</button>
    </div>
    <div class="seg" role="group" aria-label="Nézet" style="color:var(--primary)">
      <button data-view="list" aria-pressed="true">☰ Lista</button><button data-view="map" aria-pressed="false">🗺 Térkép</button>
    </div>
  </div>
  <p class="muted small" id="result-count" aria-live="polite"></p>
  <div id="list-view"><ul class="card-list" id="mester-list"></ul></div>
  <div id="map-view" hidden>
    <div class="map-wrap"><div id="map"></div>
      <div class="sheet" id="sheet"><button class="btn btn-ghost btn-sm sheet-close" id="sheet-close" aria-label="Bezárás">✕</button><div id="sheet-body"></div></div>
    </div>
  </div>
</main>

</body>
</html>
